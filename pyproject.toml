[project]
name = "whydiff-workspace"
version = "0.1.0"
description = "Workspace tooling for WhyDiff"
requires-python = ">=3.12"

[dependency-groups]
dev = [
  "build>=1.3.0",
  "dbt-duckdb>=1.10,<1.11",
  "mypy>=1.18.2",
  "pre-commit>=4.3.0",
  "pytest>=8.4.2",
  "pytest-cov>=7.0.0",
  "ruff>=0.14.0",
]

[tool.uv]
package = false

[tool.uv.sources]
whydiff-core = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["whydiff"]
mypy_path = "packages/core/src"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=whydiff --cov-report=term-missing"
pythonpath = ["packages/core/src", "packages/cli/src", "packages/mcp/src", "evals"]
testpaths = [
  "packages/core/tests",
  "packages/cli/tests",
  "packages/mcp/tests",
  "integrations/dbt_whydiff/tests",
  "evals/tests",
]

[tool.coverage.run]
branch = true
source = ["whydiff"]

[tool.coverage.report]
show_missing = true
skip_covered = true
