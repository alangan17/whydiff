name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install workspace
        run: uv sync --all-packages --frozen
      - name: Check formatting and lint
        run: make lint
      - name: Check types
        run: make typecheck
      - name: Run tests
        run: make test
      - name: Build packages
        run: make build
      - name: Verify wheels in a clean environment
        run: |
          uv venv --python ${{ matrix.python-version }} .venv-wheel
          uv pip install --python .venv-wheel/bin/python dist/*.whl
          .venv-wheel/bin/python scripts/verify_installed_packages.py
      - name: Verify source distributions in a clean environment
        run: |
          uv venv --python ${{ matrix.python-version }} .venv-sdist
          uv pip install --python .venv-sdist/bin/python dist/*.tar.gz
          .venv-sdist/bin/python scripts/verify_installed_packages.py
