[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whydiff-core"
version = "0.1.0"
description = "Typed diagnostic contracts and secure database adapters for WhyDiff"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
  "duckdb>=1.3.2",
  "pydantic>=2.11.9",
  "sqlglot>=27.17.0",
  "typing-extensions>=4,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/whydiff"]
