[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "whydiff-mcp"
version = "0.1.0"
description = "A read-only MCP server for deterministic data diagnostics"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = [
  "whydiff-core==0.1.0",
  "mcp>=1.9,<2",
  "pydantic>=2.8,<3",
]

[project.scripts]
whydiff-mcp = "whydiff_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/whydiff_mcp"]
